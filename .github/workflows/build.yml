name: Build Suit Mod DEX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build DEX
        run: |
          echo "=== Ищем файлы Java в репозитории ==="
          find . -name "*.java"
          
          echo "=== Ищем android.jar ==="
          # На серверах GitHub SDK лежит по этому пути. Берем 34, если нет - 33.
          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          else
            AJAR="$ANDROID_HOME/platforms/android-33/android.jar"
          fi
          echo "Используем: $AJAR"

          echo "=== Ищем d8 ==="
          if [ -f "$ANDROID_HOME/build-tools/34.0.0/d8" ]; then
            D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          else
            D8="$ANDROID_HOME/build-tools/33.0.0/d8"
          fi
          echo "Используем: $D8"

          echo "=== Компиляция Java в Class ==="
          mkdir -p build/classes
          # Ищем файлы в src/com/suitmod, если нет — берем из корня
          SRC_FILES="src/com/suitmod/*.java"
          if [ ! -f src/com/suitmod/SuitModMenu.java ]; then
            SRC_FILES="*.java"
          fi
          
          javac -source 8 -target 8 -cp "$AJAR" -d build/classes $SRC_FILES
          
          echo "=== Конвертация Class в DEX ==="
          "$D8" --release --min-api 21 --lib "$AJAR" --output build/ build/classes/com/suitmod/*.class
          mv build/classes.dex build/suitmod_classes.dex

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: suitmod-dex
          path: build/suitmod_classes.dex
