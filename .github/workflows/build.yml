name: Build Suit Mod DEX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Java sources
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 \
            -cp $ANDROID_HOME/platforms/android-34/android.jar \
            -d build/classes \
            src/com/suitmod/*.java

      - name: Convert to DEX with d8
        run: |
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --release \
            --min-api 21 \
            --output build/ \
            build/classes/com/suitmod/*.class
          mv build/classes.dex build/suitmod_classes.dex

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: suitmod-dex
          path: build/suitmod_classes.dex
