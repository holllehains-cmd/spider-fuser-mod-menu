name: Build Mod Menu

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with CMake
      run: |
        cd app/src/main/cpp
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
        make -j4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmod
        path: app/src/main/cpp/build/libmod.so
